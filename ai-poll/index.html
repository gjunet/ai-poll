<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poll: How do you use AI?</title>
  <meta name="description" content="One-question audience poll for the talk How I use AI in my research.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-banner" id="demo">Demo mode: votes are saved only in this browser until Firebase is set up.</div>
  <main class="vote-wrap">
    <p class="eyebrow">Poll</p>
    <h1 id="question">How do you use AI in your work now?</h1>

    <div class="choices" id="choices" role="group" aria-labelledby="question"></div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="footer">
      <img src="umb-ssw-logo.png" alt="University of Maryland School of Social Work">
      <a id="results-link" href="results.html">See live results</a>
    </div>
  </main>

  <script type="module">
    import { CHOICES, castVote, myVote, isDemo, pollName } from "./poll.js";

    const box = document.getElementById("choices");
    const status = document.getElementById("status");
    const q = location.search;
    document.getElementById("results-link").href = "results.html" + q;
    if (isDemo) document.getElementById("demo").classList.add("show");

    function show(msg, kind) {
      status.textContent = msg;
      status.className = "status show " + kind;
    }

    function render(selected) {
      box.innerHTML = "";
      CHOICES.forEach((c, i) => {
        const b = document.createElement("button");
        b.className = "choice";
        b.type = "button";
        b.setAttribute("aria-pressed", String(c.id === selected));
        b.disabled = Boolean(selected);
        b.innerHTML = `<span class="num">${i + 1}</span><span><span class="label"></span><span class="desc"></span></span>`;
        b.querySelector(".label").textContent = c.label;
        b.querySelector(".desc").textContent = c.desc;
        b.addEventListener("click", () => vote(c.id));
        box.appendChild(b);
      });
    }

    async function vote(id) {
      render(id);
      show("Saving your answer...", "ok");
      try {
        await castVote(id);
        const label = CHOICES.find(c => c.id === id).label;
        show(`Thanks. Your answer, "${label}", is counted. The results are on the screen.`, "ok");
      } catch (e) {
        if (e.message === "already-voted") {
          show("You have already answered this poll from this device.", "ok");
        } else {
          render(null);
          show("The vote did not go through. Check your connection and try again.", "err");
          console.error(e);
        }
      }
    }

    const prior = myVote();
    render(prior);
    if (prior) {
      const label = (CHOICES.find(c => c.id === prior) || {}).label || prior;
      show(`You already answered: "${label}". Thanks.`, "ok");
    }
  </script>
</body>
</html>
